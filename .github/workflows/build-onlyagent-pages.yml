name: Build OnlyAgent web app

on:
  push:
    branches:
      - onlyagent-reskin
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onlyagent-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: onlyagent-reskin
          fetch-depth: 0

      - name: Use Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build site into docs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build OnlyAgent web app"
          git push origin HEAD:onlyagent-reskin
