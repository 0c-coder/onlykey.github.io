<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84" role="img" aria-label="OnlyAgent">
  <defs>
    <linearGradient id="oaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ad6c4"/>
      <stop offset="1" stop-color="#2f8fff"/>
    </linearGradient>
  </defs>
  <!-- mark: gradient rounded square with a screen + cursor motif -->
  <rect x="6" y="10" width="64" height="64" rx="16" fill="url(#oaGrad)"/>
  <rect x="20" y="26" width="36" height="26" rx="4" fill="#04121a" opacity="0.92"/>
  <path d="M28 58 h20" stroke="#04121a" stroke-width="4" stroke-linecap="round" opacity="0.92"/>
  <!-- cursor / hand pointer inside the screen -->
  <path d="M31 33 l12 5 l-4.6 1.8 l-1.8 4.6 z" fill="#3ad6c4"/>
  <!-- wordmark -->
  <text x="86" y="54" font-family="'Share Tech Mono', ui-monospace, Menlo, monospace" font-size="34" letter-spacing="-0.5">
    <tspan fill="#e8eef5">Only</tspan><tspan fill="url(#oaGrad)">Agent</tspan>
  </text>
</svg>
